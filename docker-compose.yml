# Existing deployments can override the project and volume names in .env.
name: ${COMPOSE_PROJECT_NAME:-archie-web}

services:
  web:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      shared_network:
        aliases:
          - archie-web
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - shared_network

volumes:
  redis_data:
    name: ${REDIS_DATA_VOLUME:-${COMPOSE_PROJECT_NAME:-archie-web}_redis_data}

networks:
  shared_network:
    external: true
